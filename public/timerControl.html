<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Control - MLBB Overlay</title>
    <style>
        /* ================== FONT ASSETS ================== */
        @font-face {
            font-family: 'Big Noodle Titling';
            src: url('Assets/Font/big_noodle_titling.ttf') format('truetype');
        }

        /* ================== VARIABLES ================== */
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(24, 24, 27, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --accent-primary: #A855F7;
            --accent-secondary: #8b5cf6;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --text-main: #FAFAFA;
            --text-muted: #A1A1AA;
            --success: #10b981;
            --danger: #ef4444;
            --font-display: 'Big Noodle Titling', sans-serif;
            --font-body: 'Segoe UI', system-ui, sans-serif;
            --font-code: 'Consolas', 'Monaco', monospace;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.15), transparent 40%),
                        radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.1), transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: var(--font-display);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 32px;
            letter-spacing: 2px;
            color: var(--accent-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .timer-preview {
            font-family: var(--font-display);
            font-size: 64px;
            text-align: center;
            margin: 30px 0;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-start {
            background: var(--success);
            color: #fff;
        }
        .btn-start:hover { filter: brightness(1.1); }

        .btn-stop {
            background: var(--danger);
            color: #fff;
        }
        .btn-stop:hover { filter: brightness(1.1); }

        .btn-reset {
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            grid-column: span 2;
        }
        .btn-reset:hover { background: rgba(255,255,255,0.2); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: var(--text-main); }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="container">
        <h1>TIMER CONTROL</h1>
        
        <div class="form-group">
            <label>Label Text</label>
            <input type="text" id="labelInput" value="NEXT MATCH STARTS IN">
        </div>

        <div class="form-group">
            <label>Duration (Minutes)</label>
            <input type="number" id="minutesInput" value="5" min="0">
        </div>

        <div class="timer-preview" id="timerDisplay">05:00</div>

        <div class="controls">
            <button id="startBtn" class="btn-start">START</button>
            <button id="stopBtn" class="btn-stop" style="display:none;">STOP</button>
            <button id="resetBtn" class="btn-reset">RESET / UPDATE</button>
        </div>

        <a href="hub.html" class="back-link">← Back to Command Center</a>
    </div>

    <script>
        let timerData = {
            isRunning: false,
            endTime: 0,
            remaining: 300000,
            label: "NEXT MATCH STARTS IN"
        };
        let interval = null;

        const labelInput = document.getElementById('labelInput');
        const minutesInput = document.getElementById('minutesInput');
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Fetch initial data
        async function loadData() {
            try {
                const res = await fetch('/api/timer');
                const data = await res.json();
                timerData = data;
                updateUI();
                startLocalTimer();
            } catch (e) {
                console.error(e);
            }
        }

        function updateUI() {
            labelInput.value = timerData.label;
            
            if (timerData.isRunning) {
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                // Don't update inputs while running
            } else {
                startBtn.style.display = 'block';
                stopBtn.style.display = 'none';
                minutesInput.value = Math.floor(timerData.remaining / 60000);
            }
            renderTime();
        }

        function renderTime() {
            let ms = timerData.remaining;
            if (timerData.isRunning) {
                const now = Date.now();
                ms = Math.max(0, timerData.endTime - now);
            }
            
            const totalSeconds = Math.floor(ms / 1000);
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startLocalTimer() {
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                if (timerData.isRunning) {
                    renderTime();
                    if (Date.now() >= timerData.endTime) {
                        timerData.isRunning = false;
                        timerData.remaining = 0;
                        updateUI();
                        saveData(); // Sync finished state
                    }
                }
            }, 100);
        }

        async function saveData() {
            await fetch('/api/timer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(timerData)
            });
        }

        startBtn.onclick = async () => {
            const mins = parseInt(minutesInput.value) || 0;
            timerData.remaining = mins * 60000;
            timerData.endTime = Date.now() + timerData.remaining;
            timerData.isRunning = true;
            timerData.label = labelInput.value;
            await saveData();
            updateUI();
        };

        stopBtn.onclick = async () => {
            if (timerData.isRunning) {
                timerData.remaining = Math.max(0, timerData.endTime - Date.now());
                timerData.isRunning = false;
                await saveData();
                updateUI();
            }
        };

        resetBtn.onclick = async () => {
            const mins = parseInt(minutesInput.value) || 0;
            timerData.remaining = mins * 60000;
            timerData.isRunning = false;
            timerData.label = labelInput.value;
            await saveData();
            updateUI();
        };

        // Listen for updates from other clients
        const ws = new WebSocket(`ws://${location.host}`);
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'timer_update') {
                timerData = msg.data;
                updateUI();
            }
        };

        loadData();
    </script>
</body>
</html>
